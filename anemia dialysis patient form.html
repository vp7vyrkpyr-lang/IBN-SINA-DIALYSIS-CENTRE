<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anemia in Dialysis Patients — Data Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --bg: #eef2ee;
    --card: #ffffff;
    --primary: #0f4c46;
    --primary-dark: #0b3936;
    --primary-light: #e3efed;
    --text: #1c2a28;
    --text-muted: #62726f;
    --border: #dde5e0;
    --green: #2e7d5b;
    --green-bg: #e5f3ec;
    --amber: #b3790b;
    --amber-bg: #fbf1de;
    --orange: #c05a1a;
    --orange-bg: #fbe7db;
    --red: #b23a2e;
    --red-bg: #fbe6e3;
    --font-serif: 'Lora', Georgia, serif;
    --font-sans: 'Inter', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(15,76,70,0.07), 0 1px 2px rgba(15,76,70,0.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    min-height:100vh;
    padding-bottom: 40px;
  }

  /* ---------- Progress bar: dialysis flow line ---------- */
  .progress-wrap{
    position: sticky;
    top:0;
    z-index: 50;
    background: var(--bg);
    padding: 14px 16px 10px;
  }
  .progress-track{
    position: relative;
    height: 4px;
    border-radius: 4px;
    background: #d6e2dd;
    overflow: visible;
  }
  .progress-fill{
    position:absolute;
    left:0; top:0; height:100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--primary-dark), var(--primary));
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }
  .progress-dot{
    position:absolute;
    top:50%;
    width:11px; height:11px;
    border-radius:50%;
    background: var(--card);
    border: 2.5px solid var(--primary);
    transform: translate(-50%,-50%);
    transition: left .45s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 0 5px rgba(15,76,70,0.10);
  }
  .progress-dot::after{
    content:'';
    position:absolute; inset:-6px;
    border-radius:50%;
    border: 1.5px solid var(--primary);
    opacity:.55;
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{ transform:scale(.6); opacity:.55; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  .progress-meta{
    display:flex; justify-content:space-between;
    margin-top:9px;
    font-size:11.5px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    letter-spacing:.02em;
  }

  /* ---------- Layout ---------- */
  .app{
    max-width: 640px;
    margin: 0 auto;
    padding: 4px 16px 0;
  }
  .card{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 20px 20px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .step-eyebrow{
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: .08em;
    font-weight:600;
    margin-bottom: 4px;
  }
  h1.step-title{
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--text);
  }
  p.step-desc{
    font-size: 13.5px;
    color: var(--text-muted);
    margin: 0 0 18px;
    line-height:1.5;
  }
  .note{
    background: var(--primary-light);
    border: 1px solid #c9ddd8;
    color: var(--primary-dark);
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 18px;
    line-height:1.5;
  }

  .field{
    margin-bottom: 20px;
  }
  .field-label{
    display:block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }
  .field-label .opt{
    font-weight:400;
    color: var(--text-muted);
    font-size:11.5px;
  }
  .field-sub{
    display:block;
    font-size: 12px;
    color: var(--text-muted);
    margin: -5px 0 8px;
  }

  input[type=text], input[type=number], input[type=date], textarea{
    width:100%;
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: #fbfcfb;
    color: var(--text);
    transition: border-color .15s;
  }
  input[type=text]{ font-family: var(--font-sans); }
  input:focus, textarea:focus{
    outline:none;
    border-color: var(--primary);
    background: #fff;
  }

  .input-group{
    display:flex;
    gap:8px;
    align-items:stretch;
  }
  .input-group input{flex:1;}

  /* ---------- Chips ---------- */
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    font-family: var(--font-sans);
    font-size: 13.5px;
    font-weight:500;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #fbfcfb;
    color: var(--text);
    cursor:pointer;
    user-select:none;
    transition: all .12s ease;
    line-height:1.3;
  }
  .chip:hover{ border-color: var(--primary); }
  .chip.active{
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .chip.yes.active{ background: var(--green); border-color: var(--green); }
  .chip.no.active{ background: var(--red); border-color: var(--red); }
  .chip.small{ padding:7px 13px; font-size:12.5px; }

  /* ---------- Computed value pills ---------- */
  .computed{
    margin-top: 14px;
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--primary-light);
    border: 1px solid #c9ddd8;
    border-radius: 10px;
    padding: 10px 14px;
  }
  .computed-label{
    font-size:12px;
    color: var(--primary-dark);
    font-weight:600;
  }
  .computed-value{
    font-family: var(--font-mono);
    font-size:17px;
    font-weight:600;
    color: var(--primary-dark);
    margin-left:auto;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family: var(--font-mono);
    font-size:12.5px;
    font-weight:600;
    padding: 5px 12px;
    border-radius: 999px;
    letter-spacing:.02em;
  }
  .badge.green{ background:var(--green-bg); color:var(--green); }
  .badge.amber{ background:var(--amber-bg); color:var(--amber); }
  .badge.orange{ background:var(--orange-bg); color:var(--orange); }
  .badge.red{ background:var(--red-bg); color:var(--red); }
  .badge.gray{ background:#eef1f0; color:var(--text-muted); }
  .badge-dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }

  /* ---------- Comorbidity toggle list ---------- */
  .check-list{ display:flex; flex-direction:column; gap:8px; }
  .check-item{
    display:flex; align-items:center; gap:10px;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background:#fbfcfb;
    cursor:pointer;
    font-size: 13.5px;
    transition: all .12s;
  }
  .check-item.active{ border-color: var(--primary); background: var(--primary-light); }
  .check-box{
    width:18px; height:18px; border-radius:5px;
    border:1.5px solid var(--border);
    background:#fff;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .check-item.active .check-box{ background:var(--primary); border-color:var(--primary); }
  .check-item.active .check-box::after{
    content:'✓'; color:#fff; font-size:12px; font-weight:700;
  }

  /* ---------- Nav ---------- */
  .nav-row{
    display:flex;
    gap:10px;
    margin-top: 4px;
  }
  button.btn{
    font-family: var(--font-sans);
    font-size: 14.5px;
    font-weight:600;
    padding: 13px 18px;
    border-radius: 12px;
    border: none;
    cursor:pointer;
    transition: transform .08s, opacity .15s;
  }
  button.btn:active{ transform: scale(.98); }
  .btn-primary{
    background: var(--primary);
    color: #fff;
    flex:1;
  }
  .btn-primary:hover{ background: var(--primary-dark); }
  .btn-secondary{
    background: #fff;
    color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-ghost{
    background: transparent;
    color: var(--primary);
    border: 1.5px solid var(--primary-light);
  }
  button.btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* ---------- Summary ---------- */
  .summary-header{
    text-align:center;
    padding: 6px 0 18px;
  }
  .summary-header .badges{
    display:flex; justify-content:center; gap:8px; margin-top:12px; flex-wrap:wrap;
  }
  .summary-section{
    margin-bottom: 22px;
  }
  .summary-section h2{
    font-family: var(--font-serif);
    font-size: 15.5px;
    font-weight:600;
    color: var(--primary-dark);
    border-bottom: 1.5px solid var(--border);
    padding-bottom: 7px;
    margin: 0 0 10px;
  }
  .kv-row{
    display:flex;
    justify-content:space-between;
    gap: 12px;
    padding: 7px 0;
    font-size: 13.5px;
    border-bottom: 1px dashed #e6ebe8;
  }
  .kv-row:last-child{ border-bottom:none; }
  .kv-label{ color: var(--text-muted); flex-shrink:0; }
  .kv-value{ font-family: var(--font-mono); font-weight:600; text-align:right; }

  .action-row{
    display:flex; gap:10px; margin-top: 8px;
  }

  .step-indicator-list{
    display:flex; gap:5px; margin-top:2px;
  }

  @media (max-width: 400px){
    .card{ padding: 18px 15px 16px; }
    h1.step-title{ font-size: 20px; }
  }

  /* Printable summary target (kept in the viewport but visually hidden behind
     the app UI, since html2canvas can fail to capture elements placed with a
     negative offset outside the viewport bounds) */
  #pdf-root{
    position:fixed; top:0; left:0; z-index:-9999;
    width: 700px; background:#fff; pointer-events:none;
  }
</style>
</head>
<body>

<div class="progress-wrap">
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
    <div class="progress-dot" id="progressDot"></div>
  </div>
  <div class="progress-meta">
    <span id="progressStepLabel">Step 1 of 8</span>
    <span id="progressPctLabel">0%</span>
  </div>
</div>

<div class="app" id="app"></div>

<script>
/* ============================= STATE ============================= */
const STEP_TITLES = [
  "Patient Identification",
  "Eligibility Criteria",
  "Demographics & Socioeconomic",
  "Medical History & Comorbidities",
  "Dialysis Parameters",
  "Laboratory Investigations",
  "Treatments & Transfusion History",
  "Patient Summary"
];

let state = {
  patientId: "",
  collectionDate: "",

  inclusion: { age18: null, dialysis3m: null, centerIbnSina: null, consent: null },
  exclusion: { bleeding4w: null, transfusion4w: null, hematMalignancy: null, chemoRadio: null, pregnant: null },

  age: "", gender: null, maritalStatus: null, education: null, employment: null,
  residence: null, weight: "", height: "",

  esrdCause: null, esrdCauseOther: "", ckdDuration: "",
  comorbidities: [], hospitalAdmissions: null,

  dialysisDuration: "", dialysisDurationUnit: null, sessionsPerWeek: null,
  sessionDuration: null, vascularAccess: null, ktv: "",

  hb: "", ferritin: "", tsat: "", albumin: "", crp: "", ipth: "",

  esaTherapy: null, esaDose: "", ironSupplement: null, vitB12: null,
  folicAcid: null, transfusion6m: null, transfusionUnits: ""
};

let currentStep = 0;
const TOTAL_STEPS = STEP_TITLES.length; // 8, last one is summary

/* ============================= HELPERS ============================= */
function computeBMI(){
  const w = parseFloat(state.weight), h = parseFloat(state.height);
  if(!w || !h) return null;
  const m = h/100;
  const bmi = w/(m*m);
  return Math.round(bmi*10)/10;
}

function bmiCategory(bmi){
  if(bmi==null) return null;
  if(bmi < 18.5) return {label:"Underweight", color:"amber"};
  if(bmi < 25) return {label:"Normal", color:"green"};
  if(bmi < 30) return {label:"Overweight", color:"amber"};
  return {label:"Obese", color:"orange"};
}

function computeEligibility(){
  const inc = state.inclusion, exc = state.exclusion;
  const incVals = Object.values(inc);
  const excVals = Object.values(exc);
  if(incVals.some(v=>v===null) || excVals.some(v=>v===null)) return null; // incomplete
  const allIncYes = incVals.every(v=>v==="Yes");
  const allExcNo = excVals.every(v=>v==="No");
  return (allIncYes && allExcNo) ? "Included" : "Excluded";
}

function anemiaSeverity(){
  const hb = parseFloat(state.hb);
  if(isNaN(hb)) return null;
  if(hb < 8.0) return {label:"Severe", color:"red"};
  if(hb < 10.0) return {label:"Moderate", color:"orange"};
  const isFemale = state.gender === "Female";
  const mildUpper = isFemale ? 12.0 : 13.0; // exclusive
  if(hb < mildUpper) return {label:"Mild", color:"amber"};
  return {label:"Non-anemic", color:"green"};
}

function badgeHtml(label, color){
  return `<span class="badge ${color}"><span class="badge-dot"></span>${label}</span>`;
}

function fmt(v, suffix){
  if(v===null || v===undefined || v==="") return "—";
  return suffix ? `${v} ${suffix}` : `${v}`;
}

function yesNo(v){ return v===null ? "—" : v; }

/* ============================= CHIP / CHECK BUILDERS ============================= */
function chipRow(options, selected, onSelect, extraClass){
  return `<div class="chip-row">` + options.map(opt=>{
    const val = typeof opt === "object" ? opt.value : opt;
    const label = typeof opt === "object" ? opt.label : opt;
    const active = selected === val ? "active" : "";
    const yn = (extraClass==="yesno") ? (val==="Yes" ? "yes" : "no") : "";
    return `<div class="chip ${active} ${yn}" onclick="${onSelect}('${val}')">${label}</div>`;
  }).join("") + `</div>`;
}

/* ============================= RENDER ============================= */
function render(){
  updateProgress();
  const app = document.getElementById("app");
  app.innerHTML = renderStep(currentStep);
  window.scrollTo({top:0, behavior:"instant"});
}

function updateProgress(){
  const formSteps = TOTAL_STEPS - 1; // 7 form steps, summary is #8
  const pct = currentStep >= formSteps ? 100 : Math.round((currentStep/formSteps)*100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressDot").style.left = pct + "%";
  document.getElementById("progressStepLabel").textContent = `Step ${currentStep+1} of ${TOTAL_STEPS}`;
  document.getElementById("progressPctLabel").textContent = pct + "%";
}

function stepShell(eyebrow, title, desc, bodyHtml, noteHtml){
  return `
    <div class="card">
      <div class="step-eyebrow">${eyebrow}</div>
      <h1 class="step-title">${title}</h1>
      ${desc ? `<p class="step-desc">${desc}</p>` : ""}
      ${noteHtml ? `<div class="note">${noteHtml}</div>` : ""}
      ${bodyHtml}
    </div>
    ${navRow()}
  `;
}

function navRow(){
  const isFirst = currentStep === 0;
  const isSummary = currentStep === TOTAL_STEPS - 1;
  return `
    <div class="nav-row">
      ${!isFirst ? `<button class="btn btn-secondary" onclick="goBack()">Back</button>` : ""}
      ${!isSummary ? `<button class="btn btn-primary" onclick="goNext()">${currentStep===TOTAL_STEPS-2 ? "View Summary" : "Next"}</button>` : ""}
    </div>
  `;
}

function goNext(){ if(currentStep < TOTAL_STEPS-1){ currentStep++; render(); } }
function goBack(){ if(currentStep > 0){ currentStep--; render(); } }
function goToStep(i){ currentStep = i; render(); }

/* ---- field update handlers (exposed globally for inline onclick/onchange) ---- */
function setField(path, value){
  const parts = path.split(".");
  let obj = state;
  for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = value;
}
function updateText(path, el){ setField(path, el.value); }
function selectChip(path, value){ setField(path, value); render(); }
function toggleComorbidity(val){
  const idx = state.comorbidities.indexOf(val);
  if(idx>-1) state.comorbidities.splice(idx,1); else state.comorbidities.push(val);
  render();
}

/* ============================= STEP RENDERERS ============================= */
function renderStep(i){
  switch(i){
    case 0: return renderStep0();
    case 1: return renderStep1();
    case 2: return renderStep2();
    case 3: return renderStep3();
    case 4: return renderStep4();
    case 5: return renderStep5();
    case 6: return renderStep6();
    case 7: return renderSummary();
  }
}

function renderStep0(){
  const body = `
    <div class="field">
      <label class="field-label">Patient ID</label>
      <input type="text" placeholder="e.g. PT-014" value="${state.patientId}" oninput="updateText('patientId', this)">
    </div>
    <div class="field">
      <label class="field-label">Date of Collection</label>
      <input type="date" value="${state.collectionDate}" onchange="updateText('collectionDate', this)">
    </div>
  `;
  return stepShell("Step 0", "Patient Identification", "Basic identifiers for this data collection form.", body);
}

function renderStep1(){
  const inclusionQs = [
    ["age18","Age ≥ 18 years?"],
    ["dialysis3m","On permanent hemodialysis for at least 3 months?"],
    ["centerIbnSina","Receiving dialysis at Ibn Sina Dialysis Center during the study period?"],
    ["consent","Informed consent obtained?"]
  ];
  const exclusionQs = [
    ["bleeding4w","Known acute bleeding within the last 4 weeks (e.g. GI bleed, trauma, surgery)?"],
    ["transfusion4w","Blood transfusion within the last 4 weeks?"],
    ["hematMalignancy","Hematologic malignancy or bone marrow failure syndrome?"],
    ["chemoRadio","Currently receiving active chemotherapy or radiotherapy?"],
    ["pregnant","Currently pregnant (for female patients)?"]
  ];
  const yn = ["Yes","No"];

  let body = `<label class="field-label" style="font-family:var(--font-serif);font-size:15px;">Inclusion Criteria</label>`;
  inclusionQs.forEach(([key,label])=>{
    body += `
      <div class="field">
        <label class="field-label">${label}</label>
        ${chipRow(yn, state.inclusion[key], `selectChip.bind(null,'inclusion.${key}')`, "yesno")}
      </div>`;
  });
  body += `<label class="field-label" style="font-family:var(--font-serif);font-size:15px;margin-top:6px;">Exclusion Criteria</label>`;
  exclusionQs.forEach(([key,label])=>{
    body += `
      <div class="field">
        <label class="field-label">${label}</label>
        ${chipRow(yn, state.exclusion[key], `selectChip.bind(null,'exclusion.${key}')`, "yesno")}
      </div>`;
  });

  const elig = computeEligibility();
  if(elig){
    body += `<div class="computed">
      <span class="computed-label">Eligibility Decision</span>
      <span class="computed-value">${badgeHtml(elig, elig==="Included"?"green":"red")}</span>
    </div>`;
  }

  return stepShell("Step 1", "Eligibility Criteria", null, body,
    "The patient must meet <b>all</b> inclusion criteria and <b>none</b> of the exclusion criteria to be accepted into the study.");
}

// fix: selectChip needs a bindable form since we used .bind(null,...) string in onclick — replace with a small wrapper
function selectChipStr(path, value){ selectChip(path, value); }

function renderStep2(){
  const genderOpts = ["Male","Female"];
  const maritalOpts = ["Single","Married","Divorced","Widowed"];
  const eduOpts = ["Illiterate","Read & Write","Primary–Intermediate","Secondary","University or Higher"];
  const empOpts = ["Employed (Full/Part-time)","Unemployed/Retired","Homemaker"];
  const resOpts = ["Urban","Rural"];

  const bmi = computeBMI();
  const bmiCat = bmiCategory(bmi);

  const body = `
    <div class="field">
      <label class="field-label">Age (years)</label>
      <input type="number" min="0" value="${state.age}" oninput="updateText('age', this)">
    </div>
    <div class="field">
      <label class="field-label">Gender</label>
      ${chipRow(genderOpts, state.gender, "selectChipStr.bind(null,'gender')")}
    </div>
    <div class="field">
      <label class="field-label">Marital Status</label>
      ${chipRow(maritalOpts, state.maritalStatus, "selectChipStr.bind(null,'maritalStatus')")}
    </div>
    <div class="field">
      <label class="field-label">Educational Level</label>
      ${chipRow(eduOpts, state.education, "selectChipStr.bind(null,'education')")}
    </div>
    <div class="field">
      <label class="field-label">Employment Status</label>
      ${chipRow(empOpts, state.employment, "selectChipStr.bind(null,'employment')")}
    </div>
    <div class="field">
      <label class="field-label">Residence</label>
      ${chipRow(resOpts, state.residence, "selectChipStr.bind(null,'residence')")}
    </div>
    <div class="field">
      <label class="field-label">Weight (kg)</label>
      <input type="number" step="0.1" min="0" value="${state.weight}" oninput="updateText('weight', this); rerenderBMI();">
    </div>
    <div class="field" style="margin-bottom:8px;">
      <label class="field-label">Height (cm)</label>
      <input type="number" step="0.1" min="0" value="${state.height}" oninput="updateText('height', this); rerenderBMI();">
    </div>
    <div class="computed" id="bmiComputed">
      <span class="computed-label">BMI (kg/m²)</span>
      <span class="computed-value">${bmi ? bmi + (bmiCat? " · "+badgeHtml(bmiCat.label, bmiCat.color):"") : "—"}</span>
    </div>
  `;
  return stepShell("Step 2", "Demographics & Socioeconomic Data", null, body);
}

function rerenderBMI(){
  const bmi = computeBMI();
  const bmiCat = bmiCategory(bmi);
  const el = document.getElementById("bmiComputed");
  if(el){
    el.querySelector(".computed-value").innerHTML = bmi ? bmi + (bmiCat? " · "+badgeHtml(bmiCat.label, bmiCat.color):"") : "—";

    age: "", gender: null, maritalStatus: null, education: null, employment: null,
    residence: null, weight: "", height: "",
    esrdCause: null, esrdCauseOther: "", ckdDuration: "",
    comorbidities: [], hospitalAdmissions: null,
    dialysisDuration: "", dialysisDurationUnit: null, sessionsPerWeek: null,
    sessionDuration: null, vascularAccess: null, ktv: "",
    hb: "", ferritin: "", tsat: "", albumin: "", crp: "", ipth: "",
    esaTherapy: null, esaDose: "", ironSupplement: null, vitB12: null,
    folicAcid: null, transfusion6m: null, transfusionUnits: ""

  render();

/* ============================= PDF EXPORT ============================= */
function buildPdfRoot(){
  let root = document.getElementById("pdf-root");
  if(!root){
    root = document.createElement("div");
    root.id = "pdf-root";
    document.body.appendChild(root);
  }
  root.innerHTML = `
    <div style="font-family: Inter, sans-serif; color:#1c2a28; padding: 36px;">
      <div style="font-family: Lora, serif; font-size:22px; font-weight:700; color:#0f4c46; margin-bottom:2px;">
        Anemia in Hemodialysis Patients — Patient Summary
      </div>
      <div style="font-size:12px;color:#62726f;margin-bottom:20px;">Ibn Sina Dialysis Center research data collection form</div>
      ${summaryInnerHtml()}
    </div>
  `;
  return root;
}

function pdfFilename(){
  const id = (state.patientId || "patient").replace(/[^a-z0-9-_]/gi,"_");
  const date = state.collectionDate || new Date().toISOString().slice(0,10);
  return `${id}_${date}.pdf`;
}

function pdfLibReady(){
  if(typeof html2pdf === "undefined"){
    alert("The PDF library did not load. This app needs an internet connection the first time you open it (it loads html2pdf.js from a CDN). Please check your connection and reload the page.");
    return false;
  }
  return true;
}

function pdfOptions(){
  return {
    margin: 0,
    filename: pdfFilename(),
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
    jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['avoid-all','css','legacy'] }
  };
}

function downloadPdf(evt){
  if(!pdfLibReady()) return;
  const btn = evt ? evt.target : null;
  if(btn){ btn.disabled = true; btn.textContent = "Preparing PDF…"; }
  const root = buildPdfRoot();
  html2pdf().set(pdfOptions()).from(root).save()
    .then(()=>{ if(btn){ btn.disabled=false; btn.textContent="Download PDF"; } })
    .catch(err=>{
      console.error("PDF generation failed:", err);
      alert("Sorry, the PDF could not be generated. Details: " + (err && err.message ? err.message : err));
      if(btn){ btn.disabled=false; btn.textContent="Download PDF"; }
    });
}

async function sharePdf(evt){
  if(!pdfLibReady()) return;
  const btn = evt ? evt.target : null;
  if(btn){ btn.disabled = true; btn.textContent = "Preparing…"; }
  const root = buildPdfRoot();
  try{
    const blob = await html2pdf().set(pdfOptions()).from(root).outputPdf('blob');
    const file = new File([blob], pdfFilename(), { type: 'application/pdf' });
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title: 'Patient Summary', text: pdfFilename() });
    } else {
      // Device/browser can't share files directly — fall back to a normal download
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = pdfFilename();
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
  } catch(err){
    console.error("Share failed:", err);
    alert("Sharing didn't work, so downloading the PDF instead. Details: " + (err && err.message ? err.message : err));
    downloadPdf();
  } finally {
    if(btn){ btn.disabled=false; btn.textContent="Share"; }
  }
}

/* ============================= INIT ============================= */
